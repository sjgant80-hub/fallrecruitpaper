<style>
:root{--void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;--line:#2a2934;--line-soft:#1f1e28;--cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;--brass:#b8974a;--amber:#ff8c00;--ox:#8b1a1a;--green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;--serif:Georgia,'Libre Baskerville',ui-serif,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}input:focus,textarea:focus,select:focus{border-color:var(--brass)}a{color:var(--brass)}
.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--brass),var(--amber));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--void)}.brand .name{font-family:var(--serif);font-weight:600;font-size:14px}.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}
nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}nav.tabs button:hover{background:var(--ink);color:var(--cream)}nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}
.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
main{padding:18px 22px 60px;overflow-y:auto;max-width:1200px;margin:0 auto;width:100%}
.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px}.disclaimer strong{color:var(--brass)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600}.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}.section-h .actions{display:flex;gap:6px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px}.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}.field input,.field select,.field textarea{width:100%}.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}
.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent}.btn:hover{border-color:var(--amber);color:var(--amber)}.btn.brass{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}.btn.brass:hover{background:var(--amber)}.btn.sm{padding:4px 9px;font-size:11px}.btn.ghost{border-color:var(--line);color:var(--cream-dim)}.btn.danger:hover{border-color:var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
.pill{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass)}.pill.draft{border-color:var(--cream-muted);color:var(--cream-muted)}.pill.issued{border-color:var(--green);color:var(--green)}
.tpl-list{display:flex;flex-direction:column;gap:6px}.tpl-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:3px;cursor:pointer;background:var(--void-2)}.tpl-row:hover{border-color:var(--brass);background:var(--ink)}.tpl-row .nm{font-weight:600;font-size:13px}.tpl-row .sub{font-size:11px;color:var(--cream-muted);font-family:var(--mono)}
.doc-stage{display:grid;grid-template-columns:340px 1fr;gap:18px}.doc-side{display:flex;flex-direction:column;gap:12px}
.section-edit{margin-bottom:8px;border:1px solid var(--line);border-radius:3px;overflow:hidden}.section-edit .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--ink);font-size:12px}.section-edit .nm{font-weight:600}.section-edit .tg{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}.section-edit textarea{width:100%;border:none;border-top:1px solid var(--line);padding:8px 10px;font-size:12px;line-height:1.6;min-height:60px;resize:vertical}.section-edit.locked{border-color:var(--ox)}.section-edit.locked .hd{background:rgba(139,26,26,0.2)}.section-edit.locked .tg{color:var(--ox)}.section-edit.locked textarea{color:var(--cream-dim)}
.paper{background:#faf8f4;color:#1a1611;font-family:Georgia,serif;padding:40px 50px;border-radius:3px;font-size:13px;line-height:1.8;min-height:400px;max-height:80vh;overflow:auto}.paper strong{font-weight:700}.paper .doc-meta{font-family:var(--mono);font-size:10px;color:#888;border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:16px}.paper .clause-locked{background:#f0ebd8;border-left:3px solid #8b1a1a;padding:8px 14px;margin:10px 0;font-size:12px}.paper .sig-block{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:24px}.paper .sig-line{border-bottom:1px solid #000;min-height:34px;margin-bottom:4px}.paper .placeholder-empty{color:#c00;background:#fee;padding:0 4px;border-radius:2px;font-family:var(--mono);font-size:11px}
.empty{padding:24px;text-align:center;color:var(--cream-muted);font-style:italic;font-size:12px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px}.msg{padding:10px 14px;border-radius:6px;max-width:88%;font-size:13px;line-height:1.55;white-space:pre-wrap}.msg.user{background:var(--ink);align-self:flex-end}.msg.bot{background:var(--void-2);border:1px solid var(--line);border-left:2px solid var(--brass);align-self:flex-start}.msg .src{font-family:var(--mono);font-size:10px;color:var(--cream-muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}.chat-input{display:flex;gap:8px;margin-top:10px}.chat-input input{flex:1;padding:11px 14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:900;backdrop-filter:blur(4px)}.modal-bg.open{display:flex}.modal{background:var(--void-2);border:1px solid var(--brass);border-radius:4px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){nav.tabs button{padding:0 10px;font-size:11px}main{padding:14px 14px 50px}.row{grid-template-columns:1fr}.doc-stage{grid-template-columns:1fr}}
</style>

  <nav class="tabs" id="tabNav"></nav>

<script>
'use strict';
const TOOLNAME='fallrecruitpaper',VERSION='1.0.0',PRIME=991,STORE='fallrecruitpaper-v1';
const TABS=[{id:'templates',label:'templates'},{id:'generate',label:'generate'},{id:'documents',label:'documents'},{id:'agency',label:'agency'},{id:'qa',label:'Q&A'}];

const TEMPLATE_DEFS=[
  {id:'tob-hirer',name:'Terms of Business (Hirer)',code:'TOB-H01',cat:'terms',desc:'Standard terms between agency and hiring client',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**TERMS OF BUSINESS — SUPPLY OF TEMPORARY AND PERMANENT WORKERS**\n\nBetween: {{agency.name}} ("the Agency")\nCompany no: {{agency.companyNo}}\n{{agency.address}}\n\nAnd: {{client.company}} ("the Client")\n{{client.address}}\n\nDate: {{ctx.date}}'},
    {id:'definitions',name:'Definitions',locked:true,text:'In these Terms:\n- "Agency" means the employment business named above\n- "Client" means the person, firm, or corporate body named above\n- "Candidate" means the individual introduced by the Agency\n- "Engagement" means the engagement of a Candidate by the Client, whether under a contract of service or for services\n- "Introduction" means the Agency\'s provision of a Candidate\'s details to the Client\n- "Temporary Worker" means a Candidate supplied by the Agency to the Client on a temporary basis\n\nThese terms are governed by the Employment Agencies Act 1973 and the Conduct of Employment Agencies and Employment Businesses Regulations 2003.'},
    {id:'fees',name:'Fees',locked:false,text:'**Permanent introduction fee:** {{ctx.permFeePercent}}% of the Candidate\'s first-year gross annual remuneration\n\n**Temporary worker charge rate:** as agreed per assignment\n\n**Transfer fee (temp-to-perm):** calculated per Regulation 10, Conduct of Employment Agencies and Employment Businesses Regulations 2003. Alternative: extended hire period of {{ctx.extendedHirePeriod}} weeks.\n\n**Payment terms:** {{ctx.paymentDays}} days from date of invoice.'},
    {id:'rebate',name:'Rebate',locked:false,text:'**Fee rebate schedule (permanent placements):**\n- Candidate leaves within 4 weeks: {{ctx.rebate4wk}}% refund\n- Candidate leaves within 8 weeks: {{ctx.rebate8wk}}% refund\n- Candidate leaves within 12 weeks: {{ctx.rebate12wk}}% refund\n\nRebate applies only where the Client notifies the Agency within 7 days of the Candidate\'s departure and the Agency is given the opportunity to find a replacement.'},
    {id:'conduct',name:'Conduct Regulations',locked:true,text:'The Agency operates in accordance with the Conduct of Employment Agencies and Employment Businesses Regulations 2003:\n\n1. The Agency will use reasonable endeavours to verify the identity, right to work, qualifications, and experience of all Candidates (Regulation 22)\n2. The Agency will provide the Client with details of any Candidate introduced, including confirmation of checks performed\n3. The Client shall not engage any Candidate introduced by the Agency without paying the applicable fee, whether directly or through a third party, for a period of 6 months from the date of Introduction\n4. Transfer fees for Temporary Workers shall comply with Regulation 10'},
    {id:'awr',name:'AWR',locked:true,text:'**Agency Workers Regulations 2010:**\n\nThe Client acknowledges that:\n1. After 12 qualifying weeks in the same role, Temporary Workers are entitled to the same basic working and employment conditions as if directly recruited\n2. The Client must provide the Agency with information about relevant terms and conditions to enable compliance\n3. From day one, Temporary Workers are entitled to access to collective facilities and amenities\n4. The Client must inform the Agency of any vacant positions available'},
    {id:'ir35',name:'IR35',locked:true,text:'**Off-Payroll Working Rules (IR35):**\n\nWhere the Client is a medium or large enterprise (as defined by the Companies Act 2006 s.382):\n1. The Client is responsible for determining the employment status of any Candidate operating through a personal service company\n2. The Client must provide a Status Determination Statement (SDS) before the Candidate begins work\n3. The Client must take reasonable care in reaching the determination\n4. The Client must provide the Candidate with the right to appeal the determination\n5. The Agency will apply PAYE deductions where an "inside IR35" determination is made'},
    {id:'sigs',name:'Signatures',locked:false,text:'[SIGNATURE_BLOCK]'},
   ]},
  {id:'tob-candidate',name:'Terms of Engagement (Candidate)',code:'TOB-C01',cat:'terms',desc:'Standard terms between agency and candidate/work-seeker',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**TERMS OF ENGAGEMENT — WORK-SEEKER**\n\nBetween: {{agency.name}} ("the Agency")\n{{agency.address}}\n\nAnd: {{candidate.name}} ("the Work-Seeker")\n{{candidate.address}}\n\nDate: {{ctx.date}}'},
    {id:'services',name:'Services',locked:true,text:'The Agency provides the following services:\n1. Seeking and securing suitable employment or engagement for the Work-Seeker\n2. The Agency operates as an employment business for temporary assignments and as an employment agency for permanent introductions\n3. No fee is payable by the Work-Seeker for finding work (Employment Agencies Act 1973 s.6)\n4. The Agency will not withhold payment due to the Work-Seeker on account of non-receipt of payment from the Client'},
    {id:'obligations',name:'Work-Seeker Obligations',locked:false,text:'The Work-Seeker agrees to:\n1. Provide accurate and up-to-date information about qualifications, experience, and right to work\n2. Notify the Agency immediately of any change in circumstances that may affect suitability\n3. Comply with the Client\'s reasonable instructions during assignments\n4. Not enter into a direct arrangement with any Client introduced by the Agency without the Agency\'s consent for a period of {{ctx.restrictionMonths}} months'},
    {id:'temp',name:'Temporary Assignments',locked:false,text:'**Pay rate:** as confirmed per assignment\n**Holiday entitlement:** 5.6 weeks (28 days pro rata)\n**Holiday pay:** {{ctx.holidayPayMethod}}\n**Notice period:** {{ctx.noticePeriod}}'},
    {id:'gdpr',name:'Data Protection',locked:true,text:'**UK GDPR / Data Protection Act 2018:**\n\nThe Agency processes your personal data for the purpose of providing recruitment services. Lawful basis: consent (for applications) and legitimate interest (for proactive job matching).\n\nYour rights: access, rectification, erasure, restriction, portability, objection.\n\nData retention: your data will be retained for the period agreed at registration. You may withdraw consent at any time.\n\nFull privacy notice available on request.'},
    {id:'sigs',name:'Signatures',locked:false,text:'[SIGNATURE_BLOCK]'},
   ]},
  {id:'assignment-schedule',name:'Assignment Schedule',code:'AS-01',cat:'assignment',desc:'Temporary assignment details and conditions',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**ASSIGNMENT SCHEDULE**\n\nAssignment ref: {{ctx.assignmentRef}}\nDate: {{ctx.date}}\n\n**Worker:** {{candidate.name}}\n**Client:** {{client.company}}\n**Location:** {{ctx.location}}'},
    {id:'details',name:'Assignment Details',locked:false,text:'**Role:** {{ctx.role}}\n**Start date:** {{ctx.startDate}}\n**Expected duration:** {{ctx.duration}}\n**Working hours:** {{ctx.hours}}\n**Pay rate:** {{ctx.payRate}}\n**Holiday pay:** {{ctx.holidayPay}}\n**Expenses:** {{ctx.expenses}}'},
    {id:'conduct',name:'Conduct Requirements',locked:true,text:'Per the Conduct of Employment Agencies and Employment Businesses Regulations 2003:\n\n1. The Agency confirms that suitability checks have been performed (Regulation 22)\n2. The Worker must inform the Agency if they are unable to attend or will be late\n3. Either party may terminate this assignment with {{ctx.noticePeriod}} notice\n4. The Worker is reminded that timesheets must be submitted weekly for payment processing'},
    {id:'awr',name:'AWR Notice',locked:true,text:'**Agency Workers Regulations 2010 notice:**\n\nAfter 12 qualifying weeks in this assignment, you will be entitled to the same basic working and employment conditions as if you had been recruited directly by the Client. This includes: basic pay, overtime rates, shift allowances, annual leave, and access to collective facilities.\n\nYour qualifying week count starts from: {{ctx.startDate}}'},
    {id:'sigs',name:'Signatures',locked:false,text:'[SIGNATURE_BLOCK]'},
   ]},
  {id:'awr-letter',name:'AWR Notification Letter',code:'AWR-01',cat:'compliance',desc:'12-week AWR entitlement notification to temp worker',
   sections:[
    {id:'letter',name:'Letter',locked:false,text:'**{{agency.name}}**\n{{agency.address}}\n\nDate: {{ctx.date}}\n\n{{candidate.name}}\n{{candidate.address}}\n\nDear {{candidate.name}},\n\n**Re: Agency Workers Regulations 2010 — 12-Week Qualifying Period**\n\nI am writing to inform you that you have now completed (or are approaching) 12 qualifying weeks in your current assignment with {{client.company}}.'},
    {id:'entitlements',name:'Entitlements',locked:true,text:'Under the Agency Workers Regulations 2010, you are now entitled to the same basic working and employment conditions as if you had been recruited directly by the Client. This includes:\n\n1. **Pay:** the same basic pay (including overtime, shift allowances, unsocial hours, and annual leave) as a comparable direct recruit\n2. **Working time:** the same rest breaks, rest periods, and night work limits\n3. **Annual leave:** the same holiday entitlement (above the statutory minimum)\n\nYou have been entitled to access to collective facilities and amenities (canteen, childcare, transport) from day one of your assignment.'},
    {id:'action',name:'Action',locked:false,text:'We have obtained the relevant pay and conditions information from {{client.company}} and your pay will be adjusted accordingly from {{ctx.adjustmentDate}}.\n\nYour new pay rate will be: {{ctx.newPayRate}}\n\nIf you have any questions, please contact {{ctx.consultantName}} on {{ctx.consultantPhone}}.'},
    {id:'close',name:'Close',locked:false,text:'Yours sincerely,\n\n{{ctx.senderName}}\n{{ctx.senderTitle}}\n{{agency.name}}'},
   ]},
  {id:'ir35-sds-cover',name:'IR35 SDS Cover Letter',code:'IR35-01',cat:'compliance',desc:'Cover letter for Status Determination Statement',
   sections:[
    {id:'letter',name:'Letter',locked:false,text:'**{{agency.name}}**\n{{agency.address}}\n\nDate: {{ctx.date}}\n\nTo: {{candidate.name}}\nRe: {{client.company}} — {{ctx.role}}\n\n**Status Determination Statement — Off-Payroll Working Rules**'},
    {id:'determination',name:'Determination',locked:false,text:'The end-client, {{client.company}}, has assessed the engagement described above and determined that for the purposes of the off-payroll working rules (Chapter 10, Part 2, ITEPA 2003), this engagement falls:\n\n**☐ INSIDE IR35** — deemed employment. PAYE deductions will be applied by the fee-payer.\n**☐ OUTSIDE IR35** — the worker\'s PSC is responsible for its own tax obligations.\n\n**Reasons for determination:**\n{{ctx.reasons}}'},
    {id:'rights',name:'Rights',locked:true,text:'**Your rights under the off-payroll working rules:**\n\n1. You have the right to receive a Status Determination Statement (SDS) from the end-client before the engagement begins\n2. You have the right to appeal the determination within the client\'s dispute resolution process\n3. The client must respond to your appeal within 45 days\n4. If you disagree with the determination after the internal process, you may raise the matter with HMRC\n5. The client took reasonable care in reaching this determination, as required by the legislation'},
    {id:'close',name:'Close',locked:false,text:'Please review the attached SDS. If you wish to dispute the determination, please contact {{ctx.consultantName}} within {{ctx.appealDays}} days.\n\nYours sincerely,\n{{ctx.senderName}}\n{{agency.name}}'},
   ]},
  {id:'interview-confirm',name:'Interview Confirmation',code:'INT-01',cat:'placement',desc:'Interview details and preparation for candidate',
   sections:[
    {id:'letter',name:'Confirmation',locked:false,text:'**INTERVIEW CONFIRMATION**\n\nDate: {{ctx.date}}\n\nDear {{candidate.name}},\n\nI am pleased to confirm your interview:\n\n**Client:** {{client.company}}\n**Role:** {{ctx.role}}\n**Date:** {{ctx.interviewDate}}\n**Time:** {{ctx.interviewTime}}\n**Location:** {{ctx.interviewLocation}}\n**Format:** {{ctx.interviewFormat}}\n**Interviewer(s):** {{ctx.interviewers}}'},
    {id:'prep',name:'Preparation',locked:false,text:'**Preparation notes:**\n{{ctx.prepNotes}}\n\n**Dress code:** {{ctx.dressCode}}\n\n**Documents to bring:**\n- Photo ID\n- Right to Work documents (if not already verified)\n- Copies of relevant qualifications\n- Portfolio / examples of work (if applicable)'},
    {id:'feedback',name:'Feedback',locked:false,text:'Please confirm your attendance by replying to this message. If you need to reschedule, contact me as soon as possible.\n\nAfter the interview, I will follow up for feedback from both parties.\n\nBest regards,\n{{ctx.consultantName}}\n{{agency.name}}\n{{agency.phone}}'},
   ]},
  {id:'offer-letter',name:'Offer Confirmation Letter',code:'OFR-01',cat:'placement',desc:'Confirming permanent placement offer details',
   sections:[
    {id:'letter',name:'Letter',locked:false,text:'**{{agency.name}}**\n{{agency.address}}\n\nDate: {{ctx.date}}\n\nDear {{candidate.name}},\n\n**Congratulations — Offer of Employment**\n\nI am delighted to confirm that {{client.company}} has offered you the following position:'},
    {id:'details',name:'Offer Details',locked:false,text:'**Role:** {{ctx.role}}\n**Start date:** {{ctx.startDate}}\n**Salary:** {{ctx.salary}} per annum\n**Benefits:** {{ctx.benefits}}\n**Location:** {{ctx.location}}\n**Hours:** {{ctx.hours}}\n**Notice period:** {{ctx.noticePeriod}}\n**Probation:** {{ctx.probation}}'},
    {id:'next',name:'Next Steps',locked:false,text:'To accept this offer, please:\n1. Confirm acceptance to the agency and client\n2. Provide your start date confirmation\n3. Complete any outstanding pre-employment checks\n\nThe formal contract of employment will be issued by {{client.company}} directly.\n\nCongratulations again.\n\n{{ctx.consultantName}}\n{{agency.name}}'},
   ]},
  {id:'reference-request',name:'Reference Request',code:'REF-01',cat:'admin',desc:'Reference request to previous employer',
   sections:[
    {id:'letter',name:'Letter',locked:false,text:'**{{agency.name}}**\n{{agency.address}}\n\nDate: {{ctx.date}}\n\nTo: {{ctx.refereeName}}\n{{ctx.refereeCompany}}\n{{ctx.refereeAddress}}\n\nDear {{ctx.refereeName}},\n\n**Reference Request — {{candidate.name}}**\n\n{{candidate.name}} has applied for a position through our agency and has provided your details as a referee. We would be grateful if you could complete the following:'},
    {id:'questions',name:'Questions',locked:false,text:'1. In what capacity did you know {{candidate.name}}?\n2. Dates of employment: from _______ to _______\n3. Job title / role: _______\n4. Reason for leaving: _______\n5. Would you re-employ this person? Yes / No\n6. Any concerns regarding conduct or capability? _______\n7. Any additional comments: _______'},
    {id:'gdpr',name:'GDPR Notice',locked:true,text:'This reference will be processed in accordance with UK GDPR. The reference will be shared with the prospective employer. The candidate has provided consent for this reference to be sought. Data will be retained for the duration of the recruitment process plus 6 months.\n\nPlease return this form to {{agency.email}}.'},
    {id:'close',name:'Close',locked:false,text:'Thank you for your time.\n\n{{ctx.consultantName}}\n{{agency.name}}\n{{agency.phone}}'},
   ]},
];

let state={active:'templates',firm:null,candidates:[],clients:[],documents:[],audit:[],
  ui:{selectedTemplate:null,selectedCandidate:null,selectedClient:null,editingSections:{},extraContext:'',chat:[]},
  settings:{anthropicKey:'',auditChain:true}};

const $=(s,p=document)=>p.querySelector(s);const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','firms','candidates','clients','documents'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
async function loadAll(){if(!db)await openDB();const[firms,cands,cls,docs,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('candidates'),idbGetAll('clients'),idbGetAll('documents'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.candidates=cands;state.clients=cls;state.documents=docs;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{})}}
async function persistUI(){await idbPut('state',{value:{...state.ui},settings:state.settings},'ui')}
async function auditLog(action,opts={}){if(!state.settings.auditChain)return;const prev=state.audit.length?state.audit[state.audit.length-1]:null;const i=(prev?prev.i:0)+1;const entry={id:uid('au'),i,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,prevHash:prev?.docHash||'',docHash:'',payload:opts.payload||{}};entry.docHash=await sha256(JSON.stringify({i,ts:entry.ts,action,prevHash:entry.prevHash,payload:entry.payload}));state.audit.push(entry);await idbPut('audit',entry)}

let bcRecruit,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcRecruit=new BroadcastChannel('fall-recruit');bcRecruit.addEventListener('message',async e=>{const m=e.data;if(!m||m.source===TOOLNAME)return;if(m.type==='sync.snapshot'){const p=m.payload||{};if(Array.isArray(p.candidates))for(const c of p.candidates){if(!state.candidates.find(x=>x.id===c.id)){state.candidates.push(c);await idbPut('candidates',c)}}if(Array.isArray(p.clients))for(const c of p.clients){if(!state.clients.find(x=>x.id===c.id)){state.clients.push(c);await idbPut('clients',c)}}if(p.firm&&!state.firm){state.firm=p.firm;await idbPut('firms',p.firm)}render()}});bcRecruit.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

function buildContext(){const f=state.firm||{};const map={'agency.name':f.name||'','agency.address':f.address||'','agency.phone':f.phone||'','agency.email':f.email||'','agency.companyNo':f.companyNo||''};
  const cn=state.ui.selectedCandidate?state.candidates.find(c=>c.id===state.ui.selectedCandidate):null;
  if(cn){const nm=(cn.firstName||'')+' '+(cn.lastName||'');map['candidate.name']=cn.name||nm.trim()||'';map['candidate.address']=cn.address||'';map['candidate.email']=cn.email||'';map['candidate.phone']=cn.phone||''}
  const cl=state.ui.selectedClient?state.clients.find(c=>c.id===state.ui.selectedClient):null;
  if(cl){map['client.company']=cl.company||'';map['client.address']=cl.address||'';map['client.contact']=cl.contact||'';map['client.email']=cl.email||''}
  const extra=(state.ui.extraContext||'').split('\n');for(const line of extra){const eq=line.indexOf('=');if(eq>0)map['ctx.'+line.slice(0,eq).trim()]=line.slice(eq+1).trim()}
  return map}
function resolveText(text,ctx){return text.replace(/\{\{([^}]+)\}\}/g,(_,key)=>{const v=ctx[key.trim()];return v!=null&&v!==''?String(v):`<span class="placeholder-empty">{{${key.trim()}}}</span>`})}
function renderPaper(tpl,ctx,sections){return `<div class="doc-meta">${esc(tpl.name)} · ${esc(tpl.code)} · ${TOOLNAME} · ${dateStr(now())}</div>\n`+sections.map(s=>{const text=state.ui.editingSections?.[s.id]??s.text;const html=resolveText(text,ctx);if(s.locked)return `<div class="clause-locked">${mdB(html)}</div>`;return mdB(html)}).join('\n')}
function mdB(md){return md.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'</p><p>').replace(/\n(\d+\.\s)/g,'<br>$1').replace(/\n-\s/g,'<br>• ').replace(/☐/g,'<span style="font-size:16px">☐</span>').replace(/\[SIGNATURE_BLOCK\]/g,'<div class="sig-block"><div><div class="sig-line"></div>Signed (Agency)</div><div><div class="sig-line"></div>Signed (Counterparty)</div></div>').replace(/^/,'<p>').replace(/$/,'</p>')}

function render(){$('#tabNav').innerHTML=TABS.map(t=>`<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');const v=$('#view');switch(state.active){case 'templates':return renderTemplates(v);case 'generate':return renderGenerate(v);case 'documents':return renderDocuments(v);case 'agency':return renderAgency(v);case 'qa':return renderQA(v)}}
function switchTab(id){state.active=id;persistUI();render()}

function renderTemplates(v){const cats=[...new Set(TEMPLATE_DEFS.map(t=>t.cat))];v.innerHTML=`<div class="disclaimer"><strong>◊ Regulatory notice:</strong> FallRecruitPaper generates recruitment documents shaped by the Employment Agencies Act 1973, Conduct Regulations 2003, Agency Workers Regulations 2010, and off-payroll (IR35) rules. Locked clauses contain regulatory wording. All business decisions remain the agency\'s responsibility. Data never leaves this device.</div><div class="section-h"><h2>Templates</h2><div class="sub">${TEMPLATE_DEFS.length} templates</div></div>${cats.map(cat=>`<h3 style="font-family:var(--serif);margin:14px 0 8px;color:var(--brass);text-transform:capitalize">${cat}</h3><div class="tpl-list" style="margin-bottom:14px">${TEMPLATE_DEFS.filter(t=>t.cat===cat).map(t=>`<div class="tpl-row" onclick="selectTemplate('${t.id}')"><div><div class="nm">${esc(t.name)}</div><div class="sub">${esc(t.code)} · ${esc(t.desc)}</div></div><div class="sub">${t.sections.length} sections</div></div>`).join('')}</div>`).join('')}`}
function selectTemplate(id){state.ui.selectedTemplate=id;state.ui.editingSections={};state.active='generate';persistUI();render()}
function renderGenerate(v){const tpl=TEMPLATE_DEFS.find(t=>t.id===state.ui.selectedTemplate);if(!tpl){v.innerHTML='<div class="empty">Select a template from the Templates tab.</div>';return}const ctx=buildContext();v.innerHTML=`<div class="section-h"><h2>${esc(tpl.name)}</h2><div class="actions"><button class="btn brass sm" onclick="saveDocument('draft')">Save draft</button><button class="btn sm" style="border-color:var(--green);color:var(--green)" onclick="saveDocument('issued')">Issue</button><button class="btn ghost sm" onclick="printDoc()">Print</button></div></div><div class="doc-stage"><div class="doc-side"><div class="card"><h3>Candidate</h3><select id="candSelect" style="width:100%" onchange="state.ui.selectedCandidate=this.value;persistUI();render()"><option value="">— none —</option>${state.candidates.map(c=>{const nm=c.name||(c.firstName||'')+' '+(c.lastName||'');return `<option value="${c.id}" ${state.ui.selectedCandidate===c.id?'selected':''}>${esc(nm||c.id.slice(0,8))}</option>`}).join('')}</select></div><div class="card"><h3>Client</h3><select id="clientSelect" style="width:100%" onchange="state.ui.selectedClient=this.value;persistUI();render()"><option value="">— none —</option>${state.clients.map(c=>`<option value="${c.id}" ${state.ui.selectedClient===c.id?'selected':''}>${esc(c.company||c.id.slice(0,8))}</option>`).join('')}</select></div><div class="card"><h3>Extra Context</h3><textarea id="ctxArea" rows="6" style="width:100%;font-size:11px" oninput="state.ui.extraContext=this.value">${esc(state.ui.extraContext||'')}</textarea><div class="field"><div class="hint">key=value per line</div></div></div><div class="card"><h3>Sections</h3>${tpl.sections.map(s=>`<div class="section-edit ${s.locked?'locked':''}"><div class="hd"><span class="nm">${esc(s.name)}</span><span class="tg">${s.locked?'locked':'editable'}</span></div><textarea rows="3" ${s.locked?'readonly':''} onchange="state.ui.editingSections['${s.id}']=this.value;renderPreview()">${esc(state.ui.editingSections?.[s.id]??s.text)}</textarea></div>`).join('')}</div></div><div><div class="paper" id="paperPreview">${renderPaper(tpl,ctx,tpl.sections)}</div></div></div>`}
function renderPreview(){const tpl=TEMPLATE_DEFS.find(t=>t.id===state.ui.selectedTemplate);if(!tpl)return;const pp=$('#paperPreview');if(pp)pp.innerHTML=renderPaper(tpl,buildContext(),tpl.sections)}
async function saveDocument(status){const tpl=TEMPLATE_DEFS.find(t=>t.id===state.ui.selectedTemplate);if(!tpl){toast('No template');return}const content=renderPaper(tpl,buildContext(),tpl.sections);const hash=await sha256(content);const doc={id:uid('doc'),templateId:tpl.id,templateName:tpl.name,code:tpl.code,candidateId:state.ui.selectedCandidate||'',clientId:state.ui.selectedClient||'',status,content,hash:hash.slice(0,16),createdAt:now(),sections:{...state.ui.editingSections},extraContext:state.ui.extraContext||''};state.documents.push(doc);await idbPut('documents',doc);await auditLog('document.'+status,{reasoning:tpl.name,payload:{docId:doc.id,hash:doc.hash}});toast(status==='issued'?'Issued':'Draft saved');persistUI();render()}
function printDoc(){const pp=$('#paperPreview');if(!pp)return;const w=window.open('','_blank');w.document.write('<!DOCTYPE html><html><head><title>Print</title><style>body{font-family:Georgia,serif;font-size:13px;line-height:1.7;padding:40px 60px;color:#1a1611}strong{font-weight:700}.clause-locked{background:#f5f0e0;border-left:3px solid #8b1a1a;padding:8px 12px;margin:8px 0;font-size:12px}.sig-block{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.sig-line{border-bottom:1px solid #000;min-height:38px;margin-bottom:4px}@media print{body{padding:20px}}</style></head><body>'+pp.innerHTML+'</body></html>');w.document.close();w.print()}
function renderDocuments(v){const docs=state.documents.sort((a,b)=>b.createdAt-a.createdAt);v.innerHTML=`<div class="section-h"><h2>Documents</h2><div class="sub">${docs.length}</div></div>${docs.length?`<table><thead><tr><th>Date</th><th>Template</th><th>Code</th><th>Status</th><th>Hash</th></tr></thead><tbody>${docs.map(d=>`<tr><td>${dateStr(d.createdAt)}</td><td>${esc(d.templateName)}</td><td>${esc(d.code)}</td><td><span class="pill ${d.status}">${d.status}</span></td><td style="font-family:var(--mono);font-size:10px;color:var(--cream-muted)">${esc(d.hash)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No documents.</div>'}`}
function renderAgency(v){const f=state.firm||{};v.innerHTML=`<div class="section-h"><h2>Agency Setup</h2></div><div class="card" style="max-width:620px"><div class="row"><div class="field"><label>Agency name</label><input id="fName" value="${esc(f.name||'')}"></div><div class="field"><label>Company no</label><input id="fCoNo" value="${esc(f.companyNo||'')}"></div></div><div class="field"><label>Address</label><input id="fAddr" value="${esc(f.address||'')}"></div><div class="row"><div class="field"><label>Phone</label><input id="fPhone" value="${esc(f.phone||'')}"></div><div class="field"><label>Email</label><input id="fEmail" value="${esc(f.email||'')}"></div></div><button class="btn brass" onclick="saveAgencyForm()" style="margin-top:8px">Save</button></div>`}
async function saveAgencyForm(){const f=state.firm||{id:uid('fi'),ts:now()};f.name=$('#fName').value.trim();f.companyNo=$('#fCoNo').value.trim();f.address=$('#fAddr').value.trim();f.phone=$('#fPhone').value.trim();f.email=$('#fEmail').value.trim();f.updatedAt=now();state.firm=f;await idbPut('firms',f);await auditLog('agency.saved');toast('Saved');render()}

const T0_QA=[
  {q:/tob|terms.?of.?business|hirer.?terms|client.?terms/i,a:'Conduct Regulations 2003 Reg 18: written terms must be agreed with the hirer BEFORE services begin. Must include: fees (including transfer fees), payment terms, notice periods, authority to act, complaints procedure, which party is responsible for paying the worker. Reg 14: cannot make the supply of a worker conditional on the hirer using other services. Best practice: signed TOB with schedule of fees, rebate structure, AWR obligations, IR35 responsibilities.'},
  {q:/candidate.?terms|work.?seeker|tob.?c/i,a:'Conduct Regulations 2003 Reg 17: written terms to work-seekers before services. Must include: type of work, minimum rate of pay, whether employment business or agency, notice period, holiday entitlement/pay, that no fee is charged for finding work (s.6 EAA 1973). Opt-out provisions (Reg 10): work-seeker can opt out in writing, 7-day cooling-off. Agency must not withhold pay owed regardless of client payment.'},
  {q:/assignment|schedule|temp/i,a:'Assignment schedules should confirm: role, location, hours, duration, pay rate, holiday pay method, expenses, notice period, reporting instructions. Conduct Regs require informing the worker of the nature of work, health and safety risks, experience/qualifications required, expenses. AWR qualifying period starts from assignment start date — track weeks carefully.'},
  {q:/awr|12.?week|agency.?worker|equal/i,a:'Agency Workers Regulations 2010: after 12 qualifying weeks, equal treatment on basic pay, overtime, shift pay, annual leave. Day-one rights: access to collective facilities, vacancy information. Breaks in assignment: new role/substantively different work resets the clock; breaks of 6+ weeks reset (with exceptions for sickness up to 28 weeks, annual leave, jury duty, pregnancy/maternity up to 26 weeks). Notification letter recommended at week 10-11.'},
  {q:/ir35|sds|status.?determination|off.?payroll/i,a:'Off-payroll (IR35): medium/large clients issue SDS before engagement. Agency must pass SDS to worker with client\'s reasons. Worker can appeal — client must respond within 45 days. If "inside", fee-payer (often agency) operates PAYE. Cover letter should explain determination, reasons, and appeal rights. CEST tool recommended but not conclusive. Factors: control, substitution, mutuality.'},
  {q:/transfer|temp.?to.?perm|fee|regulation.?10/i,a:'Conduct Regulations 2003 Reg 10: transfer fee provisions. Hirer can either: (1) pay the transfer fee, or (2) agree an extended hire period (max 8 months from Regulation amendment). After the extended period, no fee is payable. Transfer fee must be reasonable and reflect actual costs. Fee reduces over time — cannot charge the same fee after 6 months as after 1 month.'},
  {q:/reference|check|suitability/i,a:'Conduct Regs Reg 22: take reasonably practicable steps to verify suitability — qualifications, experience, authorisation. References not mandatory but best practice. GDPR applies: candidate consent required, reference processed under legitimate interest. Retain reference for duration of relationship + 6 months. Cannot disclose reference content to candidate without referee\'s consent (unless required by law).'},
  {q:/rebate|refund|guarantee/i,a:'Fee rebate: standard market practice for permanent placements. Typical structure: pro-rata refund if candidate leaves within guarantee period (usually 8-13 weeks). Conditions: client must notify agency promptly (usually 7 days), allow agency to find replacement. Rebate does not apply if: client changes role significantly, redundancy, constructive dismissal. Not required by law but expected by clients.'},
];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK recruitment rules'}}return null}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK recruitment agency document expert. Conduct Regulations 2003, AWR 2010, IR35, EAA 1973, GDPR. Concise.\n\n'+q}]})});if(!res.ok)return null;const j=await res.json();return {answer:j.content?.[0]?.text,source:'T3 · Anthropic'}}catch(e){return null}}
function renderQA(v){v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div><div class="card" style="max-width:780px"><div class="chat" id="chatBox">${(state.ui.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div><div class="chat-input"><input id="chatIn" placeholder="Ask… 'TOB requirements?' · 'AWR 12-week letter?' · 'IR35 SDS?'" onkeydown="if(event.key==='Enter')askQ()"><button class="btn brass" onclick="askQ()">Ask</button></div></div>`;const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight}
async function askQ(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key for T3.',source:'system'});persistUI();render()}

function openModal(type){const modal=$('#modal');$('#modalTitle').textContent='Settings';modal.classList.add('open');$('#modalBody').innerHTML=`<div class="field"><label>Anthropic key (T3)</label><input type="password" id="sKey" value="${esc(state.settings.anthropicKey||'')}"></div><div style="margin:10px 0"><label style="font-size:12px"><input type="checkbox" id="sAudit" ${state.settings.auditChain?'checked':''}> Audit chain</label></div><div class="actions"><button class="btn ghost sm" onclick="exportAll()">Export</button><button class="btn ghost sm" onclick="importAll()">Import</button><button class="btn danger sm" onclick="wipeAll()">Wipe</button><button class="btn brass" onclick="saveSettings()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
function closeModal(){$('#modal').classList.remove('open')}
function saveSettings(){state.settings.anthropicKey=$('#sKey').value.trim();state.settings.auditChain=$('#sAudit').checked;$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';persistUI();closeModal();toast('Saved');render()}
function exportAll(){const d={tool:TOOLNAME,v:VERSION,ts:now(),firm:state.firm,candidates:state.candidates,clients:state.clients,documents:state.documents};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallrecruitpaper-export.json';a.click();URL.revokeObjectURL(u);toast('Exported')}
function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm)}for(const k of['candidates','clients','documents']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r)}}persistUI();toast('Imported');render()}catch(e){toast('Failed')}};inp.click()}
async function wipeAll(){if(!confirm('Wipe ALL data?'))return;for(const s of['firms','candidates','clients','documents','audit','state']){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r})}location.reload()}
